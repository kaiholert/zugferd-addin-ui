name: Deploy GitHub Pages

# Deployt nur den word-addin/-Unterordner (Task Pane, Manifest, Icons) nach
# GitHub Pages. Notwendig, weil das Repo jetzt das gesamte Projekt umfasst
# (word-addin/, zugferd-server/, Skripte, Doku) statt nur den Task-Pane-Code
# im Repo-Root wie zuvor.
#
# Einmalig noetig: Settings > Pages > Build and deployment > Source auf
# "GitHub Actions" umstellen (statt "Deploy from a branch").

on:
  push:
    branches: [main]
    paths:
      - 'word-addin/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload word-addin/ als Pages-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: word-addin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
